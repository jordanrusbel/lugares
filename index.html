<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Lugares</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--pri:#1a73e8;--bd:#dfe3ec;--danger:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mut:#9aa1b2;--pri:#6ea8fe;--bd:#2c303c;--danger:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.row{display:flex;gap:8px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
textarea{resize:vertical;min-height:70px}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--pri);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--danger);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
.top{display:flex;align-items:center;gap:8px}
.nm{flex:1;font-weight:600;word-break:break-word;background:none;color:var(--tx);text-align:left;padding:6px;border:0}
.nm.on{color:var(--pri)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.box{margin-top:10px}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.empty{color:var(--mut);text-align:center;margin-top:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<main>
<h1>📍 Mis Lugares</h1>
<div class="row">
  <input id="nuevo" placeholder="Escribe un nombre…" autocomplete="off">
  <button class="s" id="pegarNombre" title="Pegar">📋</button>
  <button id="agregar">Agregar</button>
</div>
<div id="lista"></div>
<p class="hint">Toca un nombre para abrir su link en Google Maps. Los links quedan ocultos.</p>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
var KEY="lugares_v1",items=[],mem=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)||[]}catch(e){items=mem||[]}}
function save(){mem=items;try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
var openBox={};
function readClip(cb){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(cb).catch(function(){toast("Mantén pulsado en el cuadro y elige Pegar")});
  }else toast("Mantén pulsado en el cuadro y elige Pegar");
}
function normalize(l){l=(l||"").trim();return l}
function abrir(l){
  l=normalize(l);if(!l)return;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(l))l="https://"+l;
  window.open(l,"_blank","noopener");
}
function render(){
  var c=document.getElementById("lista");c.innerHTML="";
  if(!items.length){c.innerHTML='<p class="empty">Aún no hay nombres. Agrega el primero arriba.</p>';return}
  items.forEach(function(it){
    var card=document.createElement("div");card.className="card";
    var top=document.createElement("div");top.className="top";
    var nm=document.createElement("button");nm.className="nm"+(it.link?" on":"");
    nm.textContent=(it.link?"📍 ":"")+it.name;
    nm.onclick=function(){it.link?abrir(it.link):(openBox[it.id]=true,render())};
    top.appendChild(nm);card.appendChild(top);
    var showBox=openBox[it.id]||!it.link;
    if(showBox){
      var b=document.createElement("div");b.className="box";
      var ta=document.createElement("textarea");ta.placeholder="Pega aquí el link de Google Maps";ta.value=it.link||"";
      var r=document.createElement("div");r.className="acts";
      var p=document.createElement("button");p.className="s";p.textContent="📋 Pegar";
      p.onclick=function(){readClip(function(t){ta.value=t})};
      var g=document.createElement("button");g.textContent="Guardar y ocultar";
      g.onclick=function(){it.link=ta.value;delete openBox[it.id];save();render();toast("Link guardado")};
      r.appendChild(p);r.appendChild(g);b.appendChild(ta);b.appendChild(r);card.appendChild(b);
      setTimeout(function(){if(!it.link&&openBox[it.id]===undefined){}},0);
    }else{
      var a=document.createElement("div");a.className="acts";
      var o=document.createElement("button");o.textContent="Abrir en Maps";o.onclick=function(){abrir(it.link)};
      var e=document.createElement("button");e.className="s";e.textContent="Editar link";e.onclick=function(){openBox[it.id]=true;render()};
      a.appendChild(o);a.appendChild(e);card.appendChild(a);
    }
    var m=document.createElement("div");m.className="acts";
    var rn=document.createElement("button");rn.className="s";rn.textContent="✏️ Nombre";
    rn.onclick=function(){var n=prompt("Nuevo nombre",it.name);if(n!==null&&n!==""){it.name=n;save();render()}};
    var dl=document.createElement("button");dl.className="d";dl.textContent="🗑 Borrar";
    dl.onclick=function(){if(confirm("¿Borrar “"+it.name+"”?")){items=items.filter(function(x){return x.id!==it.id});save();render()}};
    m.appendChild(rn);m.appendChild(dl);card.appendChild(m);
    c.appendChild(card);
  });
}
var inp=document.getElementById("nuevo");
function add(){
  var n=inp.value;if(!n.length){toast("Escribe un nombre");return}
  var it={id:uid(),name:n,link:""};items.unshift(it);openBox[it.id]=true;inp.value="";save();render();
  var ta=document.querySelector("textarea");if(ta)ta.focus();
}
document.getElementById("agregar").onclick=add;
inp.addEventListener("keydown",function(e){if(e.key==="Enter")add()});
document.getElementById("pegarNombre").onclick=function(){readClip(function(t){inp.value=t})};
load();render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
</html>
